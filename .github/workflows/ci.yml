name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:site
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "1"
      - run: grep -q "connect-src 'none'" site/dist/index.html
      - run: grep -q "frame-ancestors 'none'" site/dist/_headers
      - run: |
          grep -q "Strict-Transport-Security: max-age=31536000; includeSubDomains" site/dist/_headers
      - run: |
          grep -q "User-agent: *" site/dist/robots.txt
      - run: |
          grep -q "Sitemap: https://isolatedsources.com/sitemap.xml" site/dist/robots.txt
      - run: |
          grep -q "Content-Signal: search=yes, ai-input=no, ai-train=no" site/dist/robots.txt
      - run: if grep -q "unsafe-inline" site/dist/index.html; then exit 1; fi
      - run: if grep -R -n "github.com" site/dist; then exit 1; fi
      - run: grep -q "Copyright (c) Presidio Contributors" site/dist/NOTICE
      - run: grep -q "Madison May" site/dist/NOTICE
      - run: grep -q "Andrew Dillon" site/dist/NOTICE
      - run: test -s site/dist/LICENSE
      - run: |
          entry=$(grep -o '/assets/[^"]*\.js' site/dist/index.html | head -1)
          test -n "$entry"
          if grep -E -n "fetch\\(|XMLHttpRequest|sendBeacon|new WebSocket" "site/dist${entry}"; then exit 1; fi
